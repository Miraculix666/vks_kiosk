# ==============================================================================
# VKS Kiosk - Boot Option Configuration
# ==============================================================================
# Diese Datei liegt direkt auf dem USB-Stick (Root / Boot-Partition) und kann unter
# Windows direkt mit jedem Text-Editor (z. B. Notepad) bearbeitet werden.
#
# Standard-Auswahl steuern:
# Kommentieren Sie genau eine der Zeilen ein, oder aendern Sie 'default':
# ------------------------------------------------------------------------------
# --- Primaere Optionen ---
# set default="1. Automated VKS Video Kiosk"
# set default="2. Automated Data Transfer Station"
# set default="3. Debian Live / Rescue System"
#
# --- Vorkonfigurierte Plugin-Profile ---
# set default="4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, etc.)>4.1 VKS Kiosk + Sprachaufzeichnung (Audio-Recording)"
# set default="4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, etc.)>4.2 VKS Kiosk + SIP-Phone (VoIP / Cisco)"
# set default="4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, etc.)>4.3 VKS Kiosk Vollpaket (Video + SIP-Phone + Sprachaufzeichnung)"
# set default="4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, etc.)>4.4 Data Transfer Station + Automatischer Virenscan (ClamAV)"
# set default="4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, etc.)>4.5 Dual-Mode Matrix Kiosk (VKS + Transfer + Alle Plugins)"
#
# --- Diagnose-Optionen ---
# set default="5. Advanced & Debug Installation Options>5.1 Debug / Verbose Install - VKS Video Kiosk"
# ------------------------------------------------------------------------------
set default="0"
set timeout=5
