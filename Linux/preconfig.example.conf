# ==============================================================================
# VKS Kiosk - Preconfiguration Template
# ==============================================================================
# Speichern Sie diese Datei als 'preconfig.conf' auf dem USB-Stick (Root-Ebene),
# um die Installation ohne manuelle Eingriffe vorzukonfigurieren.
#
# Zielvariante der Installation:
#   "vks"      - Standard Videokonferenz-Kiosk (Vivaldi/Chromium)
#   "transfer" - Gesicherte Datentransfer-Station mit Virenscan (ClamAV)
#   "matrix"   - Dual-Mode mit Desktop-Auswahl
KIOSK_TARGET="vks"
KIOSK_URL="https://vks.bayern.de"
AUTO_SCAN_USB="true"
XFCE_HARDEN="true"
