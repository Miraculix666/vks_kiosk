# ==============================================================================
# VKS Kiosk - Preconfiguration File (preconfig.conf)
# ==============================================================================
# Speichern Sie diese Datei als 'preconfig.conf' im Root-Verzeichnis des USB-Sticks.
# Alle Parameter werden beim Booten und Installieren automatisch ausgewertet.

# ------------------------------------------------------------------------------
# 1. Basis-Betriebsmodus:
#    "vks"      - Reiner Videokonferenz-Kiosk (Standard)
#    "transfer" - Gesicherte Datentransfer-Station (ClamAV & Sandbox)
#    "matrix"   - Dual-Modus mit Menueauswahl auf dem Desktop
# ------------------------------------------------------------------------------
KIOSK_TARGET="vks"
KIOSK_URL="https://vks.bayern.de"

# ------------------------------------------------------------------------------
# 2. Plugin: Sprachaufzeichnung (Voice / Audio Recording)
# ------------------------------------------------------------------------------
# Aktiviert die Sprachaufzeichnung fuer Meetings/Zeugenvernehmungen
ENABLE_VOICE_RECORDING="true"
VOICE_RECORDING_FORMAT="wav"
VOICE_RECORDING_PATH="/home/vksuser/Aufzeichnungen"
VOICE_RECORDING_AUTOSTART="false"

# ------------------------------------------------------------------------------
# 3. Plugin: SIP-Phone (VoIP / Cisco DX80 Integration)
# ------------------------------------------------------------------------------
# Aktiviert den integrierten SIP-Client fuer Direktwahl & VoIP
ENABLE_SIP_PHONE="true"
SIP_SERVER="192.168.250.2"
SIP_PORT="5060"
SIP_USER="kiosk_phone"
SIP_PASSWORD=""
SIP_AUTO_ANSWER="false"

# ------------------------------------------------------------------------------
# 4. Plugin: USB-Virenscan & Security Hardening
# ------------------------------------------------------------------------------
AUTO_SCAN_USB="true"
XFCE_HARDEN="true"
