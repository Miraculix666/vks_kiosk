if [ x$feature_default_font_path = xy ] ; then
   font=unicode
else
   font=$prefix/font.pf2
fi

if loadfont $font ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi

if background_image /isolinux/splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/black
elif background_image /splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/black
else
  set menu_color_normal=cyan/blue
  set menu_color_highlight=white/blue
fi

insmod play
play 960 440 1 0 4 440 1
set theme=/boot/grub/theme/1

# ------------------------------------------------------------------------------
# Modulare Boot-Konfiguration (direkt unter Windows auf dem USB-Stick editierbar)
# ------------------------------------------------------------------------------
if [ -f /boot_option.cfg ]; then
    source /boot_option.cfg
elif [ -f /boot/grub/boot_option.cfg ]; then
    source /boot/grub/boot_option.cfg
fi

if [ -z "$default" ]; then
    set default="0"
fi
if [ -z "$timeout" ]; then
    set timeout=5
fi

# ==============================================================================
# Primaere Boot-Eintraege
# ==============================================================================
menuentry --hotkey=1 '1. Automated VKS Video Kiosk' {
    set background_color=black
    linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks auto=true priority=critical --- quiet
    initrd   /install.amd/initrd.gz
}

menuentry --hotkey=2 '2. Automated Data Transfer Station' {
    set background_color=black
    linux    /install.amd/vmlinuz vga=788 kiosk_variant=transfer auto=true priority=critical --- quiet
    initrd   /install.amd/initrd.gz
}

menuentry --hotkey=3 '3. Debian Live / Rescue System' {
    set background_color=black
    linux    /install.amd/vmlinuz rescue/enable=true vga=788 --- quiet
    initrd   /install.amd/initrd.gz
}

# ==============================================================================
# Submenue: Vorkonfigurierte Plugin- & Funktionsprofile
# ==============================================================================
submenu '4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, etc.)' {

    menuentry '4.1 VKS Kiosk + Sprachaufzeichnung (Audio-Recording)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks enable_voice_recording=true auto=true priority=critical --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry '4.2 VKS Kiosk + SIP-Phone (VoIP / Cisco)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks enable_sip_phone=true auto=true priority=critical --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry '4.3 VKS Kiosk Vollpaket (Video + SIP-Phone + Sprachaufzeichnung)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks enable_voice_recording=true enable_sip_phone=true auto=true priority=critical --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry '4.4 Data Transfer Station + Automatischer Virenscan (ClamAV)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=transfer auto_scan_usb=true auto=true priority=critical --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry '4.5 Dual-Mode Matrix Kiosk (VKS + Transfer + Alle Plugins)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=matrix enable_voice_recording=true enable_sip_phone=true auto_scan_usb=true auto=true priority=critical --- quiet
        initrd   /install.amd/initrd.gz
    }
}

# ==============================================================================
# Submenue: Erweiterte Diagnose- & Expertenoptionen
# ==============================================================================
submenu '5. Advanced & Debug Installation Options' {

    menuentry '5.1 Debug / Verbose Install - VKS Video Kiosk' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks priority=low ---
        initrd   /install.amd/initrd.gz
    }

    menuentry '5.2 Debug / Verbose Install - Data Transfer Station' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=transfer priority=low ---
        initrd   /install.amd/initrd.gz
    }

    menuentry '5.3 Expert Manual Installation (Interaktive Partitionierung)' {
        set background_color=black
        linux    /install.amd/vmlinuz priority=low vga=788 ---
        initrd   /install.amd/initrd.gz
    }
}
