# =====================================================================
# VKS Kiosk & Data Transfer Appliance - Unattended Debian Preseed
# =====================================================================

d-i debian-installer/language string de
d-i debian-installer/country string DE
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de

# Netzwerkkonfiguration (DHCP mit Hostname VKSFutro)
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string VKSFutro
d-i netcfg/get_hostname unassigned-hostname 
d-i netcfg/get_domain unassigned-domain
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain seen true
d-i hw-detect/load_firmware boolean true

# Spiegelserver-Konfiguration
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# APT-Setup: Keine Abfrage weiterer Installationsmedien (CD/DVD Scan)
# ---------------------------------------------------------------------
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true

# Automatische Partitionierung (Entire Disk, Guided)
d-i partman-auto/method string regular
d-i partman-auto/init_automatically_partition select Guided - use entire disk
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# =====================================================================
# Benutzer- und Zugangsdaten (Injected via make_vks_v1.9.sh)
# =====================================================================
d-i passwd/root-password-crypted password ###ROOT_PASSWORD###
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Kiosk
d-i passwd/username string Kiosk
d-i passwd/user-password-crypted password ###USER_PASSWORD###
d-i passwd/user-default-groups string audio cdrom video sudo

# Uhrzeit & Zeitzone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin

# Softwareauswahl
tasksel tasksel/first multiselect standard,ssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ---------------------------------------------------------------------
# Post-Install Hooks & Firstboot Service Registrierung
# ---------------------------------------------------------------------
d-i preseed/late_command string \
	cp -a /cdrom/install/make_vks.sh /target/root/ 2>/dev/null || true; \
	cp -a /cdrom/install/overlay.py /target/root/ 2>/dev/null || true; \
	in-target chmod +x /root/make_vks.sh 2>/dev/null || true; \
	in-target sh -c 'echo "[Unit]" > /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "Description=VKS Kiosk Firstboot Setup" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "After=network-online.target" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "[Service]" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "Type=oneshot" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "ExecStart=/root/make_vks.sh" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "RemainAfterExit=yes" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "[Install]" >> /etc/systemd/system/firstboot.service'; \
	in-target sh -c 'echo "WantedBy=multi-user.target" >> /etc/systemd/system/firstboot.service'; \
	in-target systemctl enable firstboot.service 2>/dev/null || true

# Bootloader-Installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note
