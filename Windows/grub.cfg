# ==============================================================================
# VKS Kiosk & Secure Data Transfer Appliance - GRUB2 Bootloader Configuration
# ==============================================================================

set default="0"
set timeout=10
set timeout_style=menu

# Video & Graphic Terminal Modules
insmod font
insmod gfxterm
insmod png
insmod jpeg
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus

set gfxmode=1920x1080,1366x768,1024x768,800x600,auto
set gfxpayload=keep
terminal_output gfxterm

# Font Loading
if [ -f $prefix/fonts/unicode.pf2 ]; then
    loadfont $prefix/fonts/unicode.pf2
elif [ -f /boot/grub/fonts/unicode.pf2 ]; then
    loadfont /boot/grub/fonts/unicode.pf2
fi

# Theme & Background Loading
if [ -f /theme/theme.txt ]; then
    set theme=/theme/theme.txt
elif [ -f /boot/grub/theme/theme.txt ]; then
    set theme=/boot/grub/theme/theme.txt
elif [ -f /boot/grub/themes/vks-modern/theme.txt ]; then
    set theme=/boot/grub/themes/vks-modern/theme.txt
elif background_image /theme/background.png; then
    set color_normal=light-gray/black
    set color_highlight=cyan/black
elif background_image /background.png; then
    set color_normal=light-gray/black
    set color_highlight=cyan/black
elif background_image /splash.png; then
    set color_normal=light-gray/black
    set color_highlight=cyan/black
fi

export theme

# ------------------------------------------------------------------------------
# Modulare Boot-Optionen (USB-Stick Konfiguration)
# ------------------------------------------------------------------------------
if [ -f /boot_option.cfg ]; then
    source /boot_option.cfg
elif [ -f /boot/grub/boot_option.cfg ]; then
    source /boot/grub/boot_option.cfg
fi

# ==============================================================================
# Primaere Boot-Eintraege mit Hotkeys & Info
# ==============================================================================
menuentry --hotkey=1 '1. Automated VKS Video Kiosk (Videokonferenz Bayern / Cisco DX80)' {
    set background_color=black
    linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks auto=true priority=critical quiet splash splash-theme=vks --- quiet
    initrd   /install.amd/initrd.gz
}

menuentry --hotkey=2 '2. Automated Data Transfer Station (Sichere USB-Schleuse / Virenscan)' {
    set background_color=black
    linux    /install.amd/vmlinuz vga=788 kiosk_variant=transfer auto=true priority=critical quiet splash splash-theme=vks --- quiet
    initrd   /install.amd/initrd.gz
}

menuentry --hotkey=3 '3. Debian Live / Rescue System (Wartung & Notfall-Shell)' {
    set background_color=black
    linux    /install.amd/vmlinuz rescue/enable=true vga=788 quiet splash --- quiet
    initrd   /install.amd/initrd.gz
}

# ==============================================================================
# Submenue: Vorkonfigurierte Plugin- & Funktionsprofile
# ==============================================================================
submenu --hotkey=4 '4. VKS Kiosk Plugin-Profile (Sprachaufzeichnung, SIP-Phone, Matrix)' {

    menuentry --hotkey=1 '4.1 VKS Kiosk + Sprachaufzeichnung (Audio-Recording)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks enable_voice_recording=true auto=true priority=critical quiet splash --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry --hotkey=2 '4.2 VKS Kiosk + SIP-Phone (VoIP / Cisco DX80)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks enable_sip_phone=true auto=true priority=critical quiet splash --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry --hotkey=3 '4.3 VKS Kiosk Vollpaket (Video + SIP-Phone + Sprachaufzeichnung)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=vks enable_voice_recording=true enable_sip_phone=true auto=true priority=critical quiet splash --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry --hotkey=4 '4.4 Data Transfer Station + Automatischer Virenscan (ClamAV)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=transfer auto_scan_usb=true auto=true priority=critical quiet splash --- quiet
        initrd   /install.amd/initrd.gz
    }

    menuentry --hotkey=5 '4.5 Dual-Mode Matrix Kiosk (VKS + Transfer + Element Desktop)' {
        set background_color=black
        linux    /install.amd/vmlinuz vga=788 kiosk_variant=matrix enable_voice_recording=true enable_sip_phone=true auto=true priority=critical quiet splash --- quiet
        initrd   /install.amd/initrd.gz
    }
}

menuentry --hotkey=5 '5. Hardware-Diagnose & Speichertest (Memtest86+)' {
    linux16 /boot/memtest86+.bin
}

menuentry --hotkey=h 'Hilfe / Schnellreferenz (Tastaturbedienung & Netzwerk)' {
    echo "=================================================================="
    echo "  VKS KIOSK & DATA TRANSFER APPLIANCE - SCHNELLHILFE"
    echo "=================================================================="
    echo "  [1] Startet den Vollbild-Videokonferenz-Kiosk (Standard: vks.bayern.de)"
    echo "  [2] Startet die abgeschottete Datentransfer-Station mit USB-Auto-Mount"
    echo "  [3] Startet die Debian Rettungsumgebung fuer Wartungsarbeiten"
    echo "  [4] Oeffnet das Plugin-Menue (SIP-Telefonie, Sprachaufnahme, ClamAV)"
    echo "  "
    echo "  Netzwerk: DHCP automatische IP-Zuweisung (VLAN 250 empfohlen)"
    echo "  Tasten:   [Pfeil Oben/Unten] Auswaehlen | [ENTER] Starten | [e] Editieren"
    echo "=================================================================="
    read
}
